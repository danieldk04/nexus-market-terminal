name: NEXUS Stock Lookup

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: 'Aandeel ticker (bijv. AAPL, MSFT, ASML.AS)'
        required: true
        type: string
      action:
        description: 'Toevoegen of verwijderen'
        required: false
        default: 'add'
        type: choice
        options:
          - add
          - remove

permissions:
  contents: write

concurrency:
  group: nexus-watchlist
  cancel-in-progress: false

jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Python 3.11 setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installeer dependencies
        run: pip install yfinance pandas requests anthropic lxml

      - name: Stock Lookup
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          LOOKUP_TICKER: ${{ inputs.ticker }}
          LOOKUP_ACTION: ${{ inputs.action }}
          PYTHONPATH: src
        run: python src/stock_lookup.py "${{ inputs.ticker }}"

      - name: Commit resultaat
        run: |
          git config user.name  "nexus-lookup-bot"
          git config user.email "nexus@bot.local"
          git add data.json
          git diff --cached --quiet || git commit -m "Watchlist ${{ inputs.action }}: ${{ inputs.ticker }} $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push
