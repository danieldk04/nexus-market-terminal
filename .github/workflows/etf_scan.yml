name: ETF SCAN — kwaliteit boven momentum

on:
  schedule:
    - cron: "0 7 * * 0"   # elke zondag 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  etf_scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.11 setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installeer dependencies
        run: pip install yfinance pandas numpy requests

      - name: ETF-engine (doorkijk-kwaliteit + momentum)
        env:
          PYTHONPATH: src
          SILENT_RUN: "true"
        run: python src/etf_engine.py

      - name: Commit & Push
        run: |
          set -e
          git config user.name  "NEXUS-InvestBot"
          git config user.email "nexus@bot.local"
          for attempt in 1 2 3; do
            git fetch origin || true
            git add etf_data.json data/etf_fundamentals.json
            git diff --cached --quiet || git commit -m "ETF-scan $(date -u +'%Y-%m-%d %H:%M UTC')"
            git merge origin/main -X ours --no-edit || true
            if git push; then echo "Push geslaagd."; break; fi
            echo "Push race verloren — opnieuw ($attempt)."
            sleep 5
          done
